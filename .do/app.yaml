# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# Replace every <placeholder>. SECRET values are set in the dashboard (or `doctl apps update`), never committed.
name: daywalker-auth
region: nyc

domains:
  - domain: users.daywalker.dev
    type: PRIMARY
    zone: daywalker.dev

databases:
  # Existing managed clusters. daywalker_auth_usr owns daywalker_auth_db and has no CONNECT on any other database.
  - name: db
    engine: PG
    production: true
    cluster_name: daywalker-prod-db-cluster
    db_name: daywalker_auth_db
    db_user: daywalker_auth_usr
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: daywalker-valkey-cache-nyc3

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: Shelbyb/daywalker-auth
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs # placeholder: size up (e.g. basic-xs / professional-xs) for production
    health_check:
      http_path: /healthz
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    envs:
      - key: APP_URL
        value: https://users.daywalker.dev
      - key: PLATFORM_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: pk_live_aW5zXzk2aXl1OHQ2Y2Y2d3d5OGRjNGkzeWU
      - key: DATABASE_URL
        scope: RUN_TIME # not build time: the image build needs no credentials
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: VALKEY_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL} # rediss:// (TLS)
      - key: TRUST_PROXY_HOPS
        scope: RUN_TIME
        value: "1"
      - key: MAIL_TRANSPORT
        scope: RUN_TIME
        value: resend
      - key: MAIL_FROM
        scope: RUN_TIME
        value: Daywalker <no-reply@daywalker.dev>
      - key: PASSKEY_RP_ID
        scope: RUN_TIME
        # The registrable parent domain, NOT users.daywalker.dev. Never change it once anyone has registered a passkey
        # or security key: every one of them stops working. See platform-docs/pages/deployment-digitalocean.md.
        value: daywalker.dev
      - key: TURNSTILE_SITE_KEY
        scope: RUN_TIME
        value: 0x4AAAAAAFjRgGz7X9Ig6AM3
      - key: TURNSTILE_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>"
      - key: MASTER_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>" # openssl rand -base64 48
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>"
      - key: INDEX_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>" # npm run keys:print-index-key

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    github:
      repo: Shelbyb/daywalker-auth
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    run_command: node migrate.mjs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: VALKEY_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
      - key: APP_URL
        scope: RUN_TIME
        value: https://users.daywalker.dev
      - key: MASTER_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>"
      - key: MAIL_TRANSPORT
        scope: RUN_TIME
        value: resend
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set-in-dashboard>"
