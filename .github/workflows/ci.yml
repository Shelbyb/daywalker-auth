name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash adds `pipefail`, so `cmd | tee file` fails when cmd fails.
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auth" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://auth:auth@localhost:5432/auth
      VALKEY_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      MAIL_TRANSPORT: dev
      # Test-only switches: allow http, and let the webhook tests call localhost.
      ALLOW_INSECURE_TRANSPORT: "1"
      WEBHOOK_ALLOW_PRIVATE: "1"
      OAUTH_TEST_BASE_URL: http://localhost:3999
      # Local mock for the breached-password API (started by breach-e2e; other suites fail open when it is down).
      PWNED_PASSWORDS_TEST_URL: http://localhost:3997
      # Mock Twilio Verify (started by sms-e2e); test-format credentials only.
      TWILIO_TEST_BASE_URL: http://localhost:3995
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: test-auth-token-0123456789
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      # Mock Cloudflare Turnstile (started by protection-e2e).
      TURNSTILE_TEST_BASE_URL: http://localhost:3993
      # DNS TXT lookups for organization domain verification read this JSON file (written by orgroles-e2e).
      DNS_TXT_TEST_FILE: /tmp/daywalker-dns-test.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL client tools (the backup drill needs pg_dump and pg_restore)
        run: |
          if ! command -v pg_dump > /dev/null || ! command -v pg_restore > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
      - name: Generate a throwaway MASTER_KEY
        run: |
          key="$(openssl rand -base64 48)"
          echo "::add-mask::$key"
          echo "MASTER_KEY=$key" >> "$GITHUB_ENV"
      - name: Type-check the service and the SDK
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Apply migrations
        run: npm run db:migrate
      - name: Build
        run: npm run build
      - name: Start the service
        run: |
          nohup npx next start -p 3000 > service.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:3000/healthz?deep=1" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "The service did not become healthy (deep check: Postgres and Valkey)" >&2
          tail -n 80 service.log >&2 || true
          exit 1
      - name: Service test suites
        run: |
          for t in e2e recovery-e2e oauth-e2e mfa-e2e account-e2e passkey-e2e legal-e2e orgs-e2e webhooks-e2e dashboard-e2e keyrotation-e2e masterkey-e2e audit-e2e auditchain-e2e emailcode-e2e breach-e2e templates-e2e providers-e2e saml-e2e sms-e2e securitykey-e2e scim-e2e protection-e2e lockout-e2e binding-e2e stepup-e2e passkeysignup-e2e accountdeletion-e2e orgroles-e2e orgui-e2e environments-e2e machineauth-e2e satellite-e2e testmode-e2e webhookreplay-e2e health-e2e backupdrill-e2e platform-e2e unauthorized-e2e; do
            # The service (started above) keeps WEBHOOK_ALLOW_PRIVATE; the test process must not, or the SSRF checks would pass for the wrong reason.
            echo "::group::$t"; env -u WEBHOOK_ALLOW_PRIVATE npx tsx scripts/$t.ts; echo "::endgroup::"
          done
      - name: SDK suite (example app)
        run: |
          npm run seed -- http://localhost:3001 | tee seed.out
          {
            echo "NEXT_PUBLIC_DAYWALKER_PUBLISHABLE_KEY=$(grep -o 'pk_test_[A-Za-z0-9_-]*' seed.out)"
            echo "NEXT_PUBLIC_DAYWALKER_AUTH_URL=http://localhost:3000"
            echo "DAYWALKER_SECRET_KEY=$(grep -o 'sk_test_[A-Za-z0-9_-]*' seed.out)"
            echo "DAYWALKER_AUTHORIZED_PARTIES=http://localhost:3001"
          } > examples/nextjs/.env.local
          (cd examples/nextjs && npx next build)
          (cd examples/nextjs && nohup npx next start -p 3001 > ../../example.log 2>&1 &)
          up=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != 1 ]; then echo "The example app did not start" >&2; tail -n 80 example.log >&2 || true; exit 1; fi
          set -a; . examples/nextjs/.env.local; set +a
          npx tsx scripts/sdk-e2e.ts
      - if: failure()
        run: tail -n 80 service.log example.log 2>/dev/null || true

  # The production image must build, run as a non-root user and answer its health check.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t daywalker-auth:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name dw -p 8080:8080 \
            -e APP_URL=http://localhost:8080 -e ALLOW_INSECURE_TRANSPORT=1 -e WEBHOOK_WORKER=0 \
            -e MASTER_KEY="$(openssl rand -base64 48)" \
            -e DATABASE_URL=postgres://nobody:nobody@127.0.0.1:1/none \
            daywalker-auth:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/healthz
          test "$(docker exec dw id -u)" != "0" || { echo "container runs as root" >&2; exit 1; }
          for _ in $(seq 1 12); do
            state="$(docker inspect --format '{{.State.Health.Status}}' dw)"
            [ "$state" = healthy ] && break
            sleep 5
          done
          test "$state" = healthy || { echo "health check reports: $state" >&2; docker logs dw >&2; exit 1; }
          docker exec dw test -f /app/migrate.mjs
      - if: always()
        run: docker rm -f dw || true
